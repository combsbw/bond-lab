<!doctype html>
<html lang="en" data-theme="light" data-ts="0" data-contrast="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bond Lab</title>
<meta name="description" content="Instruments for things too small to see. Poke atoms, electrons, bonds and water molecules and watch what happens.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f6f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08151a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308151a'/%3E%3Ccircle cx='11' cy='16' r='5' fill='none' stroke='%23ecf5f2' stroke-width='2'/%3E%3Ccircle cx='21' cy='16' r='5' fill='none' stroke='%23ecf5f2' stroke-width='2'/%3E%3Cellipse cx='17.5' cy='16' rx='6' ry='3.4' fill='%23ffb84d' opacity='.9'/%3E%3C/svg%3E">
<script>
/* Set the look before first paint so there is no flash. core.js takes over after load. */
(function () {
  try {
    var d = JSON.parse(localStorage.getItem('bondlab.display') || '{}'), r = document.documentElement;
    var dark = d.theme === 'dark' || ((!d.theme || d.theme === 'auto') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    r.setAttribute('data-theme', dark ? 'dark' : 'light');
    r.setAttribute('data-ts', String(d.size || 0));
    r.setAttribute('data-contrast', d.contrast ? 'high' : 'normal');
  } catch (e) { /* ignore */ }
})();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#view">Skip to the page</a>

<header class="bar" id="bar">
  <a class="brand" href="#/" aria-label="Bond Lab, home">
    <svg class="brand-mark" viewBox="0 0 32 20" width="34" height="22" aria-hidden="true">
      <circle cx="10" cy="10" r="7" fill="none" stroke-width="2"/>
      <circle cx="22" cy="10" r="7" fill="none" stroke-width="2"/>
      <ellipse cx="16" cy="10" rx="7" ry="4" opacity=".9"/>
    </svg>
    <span class="brand-name">Bond Lab</span>
  </a>
  <nav class="crumb" id="crumb" aria-label="Where you are"></nav>
  <button class="display-btn" id="display-btn" type="button" aria-expanded="false" aria-controls="display-pop">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
    <span>Display</span>
  </button>
  <div class="display-pop" id="display-pop" role="group" aria-label="Display settings" hidden></div>
</header>

<main id="view" tabindex="-1"></main>

<footer class="foot">
  <span>Bond Lab is a set of instruments, not a textbook. Poke things.</span>

</footer>
